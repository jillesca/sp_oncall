name: sp-oncall-webhook

# Webhook proxy: receives Alertmanager/Grafana webhooks and starts an sp_oncall
# investigation on the LangGraph server running on the host (`make run`).
#
# Deliberately no `env_file:`. The sp_oncall .env holds API keys
# (OPENAI_API_KEY, LANGSMITH_API_KEY) that must not reach this container.
# Variables below are read from the shell environment or use the defaults.
services:
  webhook:
    build: .
    restart: unless-stopped
    ports:
      # Loopback by default: the endpoint is unauthenticated and triggers LLM
      # runs. Linux Docker needs WEBHOOK_BIND=0.0.0.0 for Alertmanager to reach it.
      - "${WEBHOOK_BIND:-127.0.0.1}:${WEBHOOK_PORT:-8080}:8080"
    environment:
      - LANGGRAPH_API_URL=${LANGGRAPH_API_URL:-http://host.docker.internal:2024}
      - LANGGRAPH_ASSISTANT_ID=${LANGGRAPH_ASSISTANT_ID:-agent}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
